<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Repostium Downloader</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="container">

    <h1>⚡ Repostium Downloader</h1>

    <p class="subtitle">
        Download Video Kualitas Terbaik
    </p>

    <div class="search-box">

        <input
            id="video-url"
            type="text"
            placeholder="Tempel URL Video..."
        >

        <button id="check-btn">
            Download
        </button>

    </div>

    <div id="loading">

        Mengambil informasi video...

    </div>

    <div id="result">

        <img id="thumbnail">

        <h2 id="title"></h2>

        <p id="uploader"></p>

        <p id="duration"></p>

        <button id="download-btn">

            Download HD

        </button>

    </div>

</div>

<script src="/static/js/script.js"></script>

</body>

</html>
